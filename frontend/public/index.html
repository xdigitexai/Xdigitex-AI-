<script>
(function() {
  'use strict';
  // ── XD Conversation Persistence Shim ─────────────────────────────────────
  // Stores conversationId per server so each new message reuses the same conversation.
  // Also stores runId so we can poll /runs/:runId to recover from stuck "Working..." state.

  const store = {
    getConv: (sid) => sessionStorage.getItem('_xd_conv_' + sid) || null,
    setConv: (sid, cid) => sessionStorage.setItem('_xd_conv_' + sid, cid),
    getRun:  (sid) => sessionStorage.getItem('_xd_run_' + sid) || null,
    setRun:  (sid, rid) => sessionStorage.setItem('_xd_run_' + sid, rid),
    getTask: (sid) => sessionStorage.getItem('_xd_task_' + sid) || null,
    setTask: (sid, tid) => sessionStorage.setItem('_xd_task_' + sid, tid),
  };

  // Expose globally for devtools debugging
  window.XD_CONV = {
    getState: (serverId) => ({
      conversationId: store.getConv(serverId),
      runId: store.getRun(serverId),
      taskId: store.getTask(serverId),
    }),
    clearConv: (serverId) => {
      sessionStorage.removeItem('_xd_conv_' + serverId);
      sessionStorage.removeItem('_xd_run_' + serverId);
      sessionStorage.removeItem('_xd_task_' + serverId);
      console.log('[XD] Conversation cleared for server', serverId);
    },
    pollRunStatus: async (serverId, runId, token) => {
      try {
        const r = await fetch(`/api/servers/${serverId}/runs/${runId}`, {
          headers: token ? { Authorization: 'Bearer ' + token } : {}
        });
        if (!r.ok) return null;
        return await r.json();
      } catch { return null; }
    }
  };

  const _origFetch = window.fetch.bind(window);

  window.fetch = async function(input, init) {
    const url = typeof input === 'string' ? input : (input instanceof Request ? input.url : String(input));

    // ── Intercept POST /api/servers/:id/chat ─────────────────────────────
    const chatMatch = url.match(/\/api\/servers\/(\d+)\/chat$/);
    if (chatMatch && (!init?.method || init.method.toUpperCase() === 'POST')) {
      const serverId = chatMatch[1];
      const storedConvId = store.getConv(serverId);

      // Inject conversationId into request body
      if (storedConvId && init?.body) {
        try {
          const body = JSON.parse(init.body);
          if (!body.conversationId) {
            body.conversationId = storedConvId;
            init = { ...init, body: JSON.stringify(body) };
          }
        } catch (_e) {}
      }

      // Make the real request
      const response = await _origFetch(input, init);

      // Clone to read body without consuming it
      const clone = response.clone();
      clone.json().then(data => {
        if (data?.conversationId) store.setConv(serverId, data.conversationId);
        if (data?.runId)          store.setRun(serverId, data.runId);
        if (data?.taskId)         store.setTask(serverId, data.taskId);
      }).catch(() => {});

      return response;
    }

    return _origFetch(input, init);
  };

  // ── Watchdog: poll /runs/:runId on page visibility to recover stuck UI ──
  // When the page comes back into focus after being hidden, check if the
  // current run is actually done. If so, fire a custom event that listeners can use.
  let _watchdogTimer = null;
  const _startWatchdog = () => {
    if (_watchdogTimer) return;
    _watchdogTimer = setInterval(async () => {
      // Find all active server contexts (ones that have a stored run)
      for (let i = 0; i < sessionStorage.length; i++) {
        const key = sessionStorage.key(i);
        if (!key?.startsWith('_xd_run_')) continue;
        const sid = key.replace('_xd_run_', '');
        const rid = sessionStorage.getItem(key);
        if (!rid) continue;
        try {
          const r = await _origFetch(`/api/servers/${sid}/runs/${rid}`);
          if (!r.ok) continue;
          const data = await r.json();
          if (data?.status && data.status !== 'running') {
            // Run is done — dispatch event so React can react
            window.dispatchEvent(new CustomEvent('xd:run_completed', {
              detail: { serverId: sid, runId: rid, status: data.status }
            }));
            // Clear the stored run so we don't keep polling
            sessionStorage.removeItem('_xd_run_' + sid);
          }
        } catch (_e) {}
      }
    }, 15000); // poll every 15s
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') _startWatchdog();
  });
  _startWatchdog();

  console.log('[XD] Conversation persistence shim loaded. Use window.XD_CONV for debugging.');
})();
</script>
